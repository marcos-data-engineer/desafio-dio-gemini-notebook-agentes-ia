<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <!-- Fundo Dark Theme -->
  <rect width="800" height="480" fill="#0f172a" rx="12"/>
  
  <!-- Título -->
  <text x="400" y="38" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">Divergência Auto-Regressiva &amp; Acumulação de Erros</text>
  <text x="400" y="60" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13">Decaimento Exponencial da Probabilidade de Sucesso: P(N) = (1 - ε)ⁿ</text>

  <!-- Eixos do Gráfico -->
  <line x1="80" y1="400" x2="740" y2="400" stroke="#64748b" stroke-width="2"/>
  <line x1="80" y1="90" x2="80" y2="400" stroke="#64748b" stroke-width="2"/>

  <!-- Linhas de Grelha -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4">
    <line x1="80" y1="322" x2="740" y2="322"/>
    <line x1="80" y1="244" x2="740" y2="244"/>
    <line x1="80" y1="166" x2="740" y2="166"/>
    <line x1="245" y1="90" x2="245" y2="400"/>
    <line x1="410" y1="90" x2="410" y2="400"/>
    <line x1="575" y1="90" x2="575" y2="400"/>
    <line x1="740" y1="90" x2="740" y2="400"/>
  </g>

  <!-- Rótulos Eixos -->
  <text x="410" y="435" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">Comprimento da Sequência de Tokens (N)</text>
  <text x="30" y="245" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12" transform="rotate(-90 30 245)">Probabilidade de Sucesso P(N)</text>

  <!-- Curva de Sucesso -->
  <path d="M 80 110 C 200 115, 300 280, 740 392" fill="none" stroke="#ef4444" stroke-width="4"/>
  <path d="M 80 110 C 130 112, 180 125, 230 160" fill="none" stroke="#10b981" stroke-width="4"/>

  <!-- Área de Alucinação / Divergência -->
  <path d="M 80 110 C 200 115, 300 280, 740 392 L 740 400 L 80 400 Z" fill="#ef4444" opacity="0.15"/>

  <!-- Pontos de Amostragem na Curva -->
  <circle cx="80" cy="110" r="6" fill="#10b981"/>
  <circle cx="230" cy="160" r="6" fill="#f59e0b"/>
  <circle cx="410" cy="285" r="6" fill="#ef4444"/>
  <circle cx="650" cy="380" r="6" fill="#dc2626"/>

  <!-- Destaque Token 1 -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="160" height="42" fill="#064e3b" rx="6" stroke="#10b981" stroke-width="1.5"/>
    <text x="80" y="18" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">Início da Cadeia (N=1)</text>
    <text x="80" y="32" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-size="10">P(Sucesso) ≈ 99.9%</text>
  </g>

  <!-- Destaque Divergência -->
  <g transform="translate(430, 210)">
    <rect x="0" y="0" width="230" height="52" fill="#450a0a" rx="6" stroke="#ef4444" stroke-width="1.5"/>
    <text x="115" y="20" text-anchor="middle" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold">Divergência Irrecuperável</text>
    <text x="115" y="38" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="10">Acumulação Exponencial de Erros</text>
  </g>

  <!-- Formula Card -->
  <g transform="translate(480, 95)">
    <rect x="0" y="0" width="220" height="44" fill="#1e1b4b" rx="6" stroke="#818cf8" stroke-width="1.5"/>
    <text x="110" y="18" text-anchor="middle" fill="#c7d2fe" font-family="sans-serif" font-size="11" font-weight="bold">Fórmula do Erro Acumulado</text>
    <text x="110" y="34" text-anchor="middle" fill="#e0e7ff" font-family="sans-serif" font-size="11">P_sucesso = (1 - ε)ⁿ</text>
  </g>

  <!-- Legenda -->
  <g transform="translate(120, 458)">
    <line x1="0" y1="5" x2="25" y2="5" stroke="#10b981" stroke-width="3"/>
    <text x="32" y="9" fill="#cbd5e1" font-family="sans-serif" font-size="11">Zona de Alta Precisão</text>

    <line x1="220" y1="5" x2="245" y2="5" stroke="#ef4444" stroke-width="3"/>
    <text x="252" y="9" fill="#cbd5e1" font-family="sans-serif" font-size="11">Degradação por Alucinação</text>
  </g>
</svg>
