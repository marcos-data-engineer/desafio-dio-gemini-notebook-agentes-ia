<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <!-- Fundo Dark Theme -->
  <rect width="800" height="480" fill="#0f172a" rx="12"/>
  
  <!-- Linhas de Grelha -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4">
    <line x1="80" y1="380" x2="740" y2="380"/>
    <line x1="80" y1="300" x2="740" y2="300"/>
    <line x1="80" y1="220" x2="740" y2="220"/>
    <line x1="80" y1="140" x2="740" y2="140"/>
    <line x1="80" y1="60"  x2="740" y2="60"/>
    <line x1="80" y1="60"  x2="80"  y2="380"/>
    <line x1="245" y1="60" x2="245" y2="380"/>
    <line x1="410" y1="60" x2="410" y2="380"/>
    <line x1="575" y1="60" x2="575" y2="380"/>
    <line x1="740" y1="60" x2="740" y2="380"/>
  </g>

  <!-- Título -->
  <text x="400" y="38" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">Scaling Laws vs. Plateau da AGI</text>

  <!-- Eixos -->
  <line x1="80" y1="380" x2="740" y2="380" stroke="#64748b" stroke-width="2"/>
  <line x1="80" y1="60"  x2="80"  y2="380" stroke="#64748b" stroke-width="2"/>

  <!-- Rótulos dos Eixos -->
  <text x="410" y="420" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">Recursos Computacionais &amp; Volume de Dados Textuais</text>
  <text x="30" y="220" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12" transform="rotate(-90 30 220)">Capacidade Cognitiva &amp; Raciocínio Real</text>

  <!-- Linha de Teto do Plateau (Vermelha) -->
  <line x1="80" y1="180" x2="740" y2="180" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,6"/>
  <rect x="510" y="162" width="220" height="26" fill="#450a0a" rx="4" stroke="#ef4444" stroke-width="1"/>
  <text x="620" y="179" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="bold">Teto da Previsão Estatística</text>

  <!-- Curva LLM (Azul) -->
  <path d="M 80 370 C 200 350, 300 200, 740 185" fill="none" stroke="#3b82f6" stroke-width="4"/>

  <!-- Curva World Models / JEPA (Verde) -->
  <path d="M 80 370 C 250 365, 420 340, 500 250 C 580 160, 650 80, 740 70" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="8,4"/>

  <!-- Caixa de Destaque: Plateau LLM -->
  <g transform="translate(260, 105)">
    <rect x="0" y="0" width="230" height="48" fill="#1e1b4b" rx="6" stroke="#ef4444" stroke-width="1.5"/>
    <text x="115" y="20" text-anchor="middle" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold">Plateau do Papagaio Estocástico</text>
    <text x="115" y="36" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="10">(Alucinações &amp; Erro Acumulado)</text>
  </g>

  <!-- Caixa de Destaque: World Models -->
  <g transform="translate(530, 240)">
    <rect x="0" y="0" width="190" height="48" fill="#064e3b" rx="6" stroke="#10b981" stroke-width="1.5"/>
    <text x="95" y="20" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">Raciocínio Causal</text>
    <text x="95" y="36" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-size="10">&amp; World Models (JEPA)</text>
  </g>

  <!-- Legenda -->
  <g transform="translate(100, 442)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#3b82f6" stroke-width="3"/>
    <text x="38" y="14" fill="#cbd5e1" font-family="sans-serif" font-size="11">LLMs (Scaling Laws)</text>

    <line x1="220" y1="10" x2="250" y2="10" stroke="#10b981" stroke-width="3" stroke-dasharray="6,3"/>
    <text x="258" y="14" fill="#cbd5e1" font-family="sans-serif" font-size="11">World Models (JEPA / AGI)</text>

    <line x1="480" y1="10" x2="510" y2="10" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="518" y="14" fill="#cbd5e1" font-family="sans-serif" font-size="11">Teto Estatístico</text>
  </g>
</svg>
